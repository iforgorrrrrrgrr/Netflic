<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETFLIC // Cinema & Video Production Portfolio</title>
  <meta name="description"
    content="Premium cinematic client video gallery — motion graphics, VFX, high-end commercials, directorship, and documentary work.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#000921',
              surface: '#041033',
              card: '#071540',
              cardHover: '#0c1f5c',
              accent: '#305CDE',
              accentHover: '#244ab7',
              accentLight: '#7aa0ff',
              accentGlow: '#1a3fa8',
              muted: '#6a84c4',
              border: '#152d6e',
              borderHover: '#305CDE',
              dark: '#00061a',
              hero: '#010c2a',
              stats: '#020e30',
            }
          },
          fontFamily: {
            sans:    ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            royal:   ['Cormorant Garamond', 'Georgia', 'serif'],
          },
          boxShadow: {
            'glow-sm': '0 0 15px -3px rgba(48, 92, 222, 0.35)',
            'glow': '0 0 25px -5px rgba(48, 92, 222, 0.5)',
            'glow-lg': '0 0 50px -8px rgba(48, 92, 222, 0.7)',
            'glow-xl': '0 0 80px -10px rgba(48, 92, 222, 0.9)',
            'inner-glow': 'inset 0 0 30px rgba(48,92,222,0.12)',
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'float-slow': 'float 9s ease-in-out infinite',
            'shimmer': 'shimmer 2s linear infinite',
            'pulse-ring': 'pulse-ring 2s cubic-bezier(0.4,0,0.6,1) infinite',
            'scan-line': 'scan-line 4s linear infinite',
            'counter-up': 'counter-up 0.6s ease-out forwards',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-18px)' } },
            shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
            'pulse-ring': { '0%,100%': { opacity: '1' }, '50%': { opacity: '.4' } },
            'scan-line': { '0%': { transform: 'translateY(-100%)' }, '100%': { transform: 'translateY(100vh)' } },
            'counter-up': { from: { opacity: '0', transform: 'translateY(10px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
          }
        }
      }
    }
  </script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* ─── Scrollbar ──────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #000921;
    }

    ::-webkit-scrollbar-thumb {
      background: #152d6e;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #305CDE;
    }

    /* ─── Global ─────────────────────────────────────────── */
    [x-cloak] {
      display: none !important;
    }

    body {
      background: #000921;
      overflow-x: hidden;
    }

    /* ─── Scan line FX ───────────────────────────────────── */
    .scan-line {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(48, 92, 222, 0.4), transparent);
      animation: scan-line 8s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    /* ─── Noise overlay ──────────────────────────────────── */
    .noise-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ─── Section separators ─────────────────────────────── */
    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #305CDE 30%, #7aa0ff 50%, #305CDE 70%, transparent);
      opacity: 0.4;
    }

    /* ─── Floating orbs ──────────────────────────────────── */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(48, 92, 222, 0.15) 0%, transparent 70%);
      top: -100px;
      left: -150px;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(122, 160, 255, 0.1) 0%, transparent 70%);
      top: 60%;
      right: -100px;
      animation-delay: -3s;
      animation-duration: 10s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(48, 92, 222, 0.12) 0%, transparent 70%);
      bottom: 10%;
      left: 30%;
      animation-delay: -5s;
    }

    /* ─── Card spotlight effect ──────────────────────────── */
    .card-spotlight {
      background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(48, 92, 222, 0.12), transparent 60%);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: inherit;
    }

    .card-spotlight-wrapper:hover .card-spotlight {
      opacity: 1;
    }

    /* ─── Shimmer skeleton ───────────────────────────────── */
    .shimmer-bg {
      background: linear-gradient(90deg, #071540 25%, #152d6e 50%, #071540 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s linear infinite;
    }

    /* ─── Hero gradient mesh ─────────────────────────────── */
    .hero-mesh {
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(48, 92, 222, 0.22) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 50%, rgba(122, 160, 255, 0.08) 0%, transparent 60%),
        #000921;
    }

    /* ─── Stats section bg ───────────────────────────────── */
    .stats-section {
      background:
        linear-gradient(180deg, #000921 0%, #020e30 30%, #041033 60%, #020e30 80%, #000921 100%);
      border-top: 1px solid rgba(48, 92, 222, 0.3);
      border-bottom: 1px solid rgba(48, 92, 222, 0.3);
    }

    /* ─── Gallery section bg ─────────────────────────────── */
    .gallery-section {
      background: linear-gradient(180deg, #000921 0%, #02081f 40%, #000921 100%);
    }

    /* ─── Gradient text ──────────────────────────────────── */
    .gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #7aa0ff 50%, #305CDE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── Animated border ────────────────────────────────── */
    .animated-border {
      position: relative;
    }

    .animated-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(90deg, #305CDE, #7aa0ff, #305CDE);
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .animated-border:hover::before {
      opacity: 1;
    }

    /* ─── Progress bar ───────────────────────────────────── */
    .progress-bar {
      height: 2px;
      background: linear-gradient(90deg, #305CDE, #7aa0ff);
      border-radius: 1px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(48, 92, 222, 0.6);
    }

    /* ─── Tag hover glow ─────────────────────────────────── */
    .tag-blue {
      transition: all 0.2s;
    }

    .tag-blue:hover {
      background: rgba(48, 92, 222, 0.35) !important;
      border-color: rgba(122, 160, 255, 0.6) !important;
      box-shadow: 0 0 12px rgba(48, 92, 222, 0.4);
      transform: translateY(-1px);
    }

    /* ─── Keyboard hint ──────────────────────────────────── */
    kbd {
      display: inline-block;
      padding: 1px 6px;
      font-size: 10px;
      background: rgba(48, 92, 222, 0.15);
      border: 1px solid rgba(48, 92, 222, 0.3);
      border-radius: 4px;
      font-family: 'Space Grotesk', monospace;
      color: #7aa0ff;
    }

    /* ─── Modal tabs ─────────────────────────────────────── */
    .modal-tab {
      position: relative;
      transition: color 0.2s;
    }

    .modal-tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: #305CDE;
      border-radius: 1px;
      transform: scaleX(0);
      transition: transform 0.25s ease;
      box-shadow: 0 0 8px rgba(48, 92, 222, 0.6);
    }

    .modal-tab.active::after {
      transform: scaleX(1);
    }

    .modal-tab.active {
      color: #7aa0ff;
    }

    /* ─── Card reveal animation ──────────────────────────── */
    .card-reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .card-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ─── no-scrollbar ───────────────────────────────────── */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ─────────────────────────────────────────────────────────
       OBRA MAESTRA DEL ARTE — Royal Headline
    ───────────────────────────────────────────────────────── */
    .obra-maestra {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1.1;
      display: block;
    }

    .obra-text {
      /* Gradient referencing the brand palette: deep navy → royal blue → ice blue */
      background: linear-gradient(
        130deg,
        #c8d8ff 0%,
        #7aa0ff 28%,
        #305CDE 55%,
        #7aa0ff 78%,
        #e8efff 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: background-position 0.6s ease, filter 0.4s ease;
      display: inline;
    }

    .obra-italic {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      background: linear-gradient(
        130deg,
        #8fb4ff 0%,
        #ffffff 50%,
        #8fb4ff 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: background-position 0.6s ease;
      display: inline;
      margin-left: 0.08em;
    }

    /* Hover: slide gradient + soft glow */
    .obra-maestra:hover .obra-text {
      background-position: right center;
      filter: drop-shadow(0 0 22px rgba(122, 160, 255, 0.55));
    }
    .obra-maestra:hover .obra-italic {
      background-position: right center;
    }

    /* ─── Stat number royal gradient ────────────────────── */
    .stat-number {
      background: linear-gradient(135deg, #c8d8ff 0%, #7aa0ff 50%, #305CDE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: filter 0.3s ease;
    }
    .stat-number-hover {
      filter: drop-shadow(0 0 10px rgba(122, 160, 255, 0.5));
    }
    /* ─── Hero title royal gradient ──────────────────── */
    .hero-title-gradient {
      background: linear-gradient(
        130deg,
        #ffffff  0%,
        #c8d8ff 30%,
        #7aa0ff 60%,
        #ffffff 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 6s linear infinite;
    }
  </style>
</head>

<body x-data="galleryApp()" @keydown.escape.window="closeModal()"
  @keydown.arrow-right.window="if(isModalOpen) nextProject()" @keydown.arrow-left.window="if(isModalOpen) prevProject()"
  class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen selection:bg-brand-accent selection:text-white">

  <!-- ── Ambient FX Layer ─────────────────────────────────── -->
  <div class="noise-overlay"></div>
  <div class="scan-line"></div>

  <!-- ── Canvas Background Particles ─────────────────────── -->
  <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

  <!-- ═══════════════════════════════════════════════════════
       NAVIGATION HEADER
  ═══════════════════════════════════════════════════════ -->
  <header x-data="{ scrolled: false, mobileMenuOpen: false }" @scroll.window="scrolled = (window.pageYOffset > 30)"
    :class="scrolled
      ? 'bg-brand-dark/98 backdrop-blur-md border-b border-brand-border/80 py-3 shadow-glow'
      : 'bg-gradient-to-b from-brand-dark/90 to-transparent py-5'"
    class="fixed top-0 left-0 right-0 z-40 transition-all duration-500">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">

      <!-- Logo -->
      <a href="#" class="flex items-center space-x-3 group">
        <div class="relative">
          <div
            class="w-8 h-8 bg-brand-accent rounded-lg flex items-center justify-center shadow-glow group-hover:shadow-glow-lg transition-shadow duration-300">
            <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24">
              <path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 3l3-3 3 3-3 3z" />
            </svg>
          </div>
          <div
            class="absolute -inset-1 bg-brand-accent/20 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 blur-sm">
          </div>
        </div>
        <span class="font-display font-extrabold text-xl tracking-wider text-white">
          NET<span class="text-brand-accentLight">FLIC</span>
        </span>
      </a>

      <!-- Desktop Controls -->
      <div class="hidden md:flex items-center space-x-4">

        <div
          class="flex items-center space-x-2 text-xs text-brand-muted bg-brand-surface/60 px-3 py-1.5 rounded-full border border-brand-border/60">
          <span>Showing - <strong class="text-white" x-text="filteredProjects.length"></strong> Works</span>
        </div>

        <!-- Search -->
        <div class="relative">
          <svg class="w-4 h-4 text-brand-muted absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="searchInput" x-model="searchQuery" placeholder="Search works, clients, techniques…"
            class="bg-brand-surface/80 border border-brand-border focus:border-brand-accent text-sm text-white placeholder-brand-muted rounded-full pl-9 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-brand-accent/30 transition-all duration-300 w-52 focus:w-72">
          <button x-show="searchQuery.length > 0" @click="searchQuery = ''"
            x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 scale-75"
            x-transition:enter-end="opacity-100 scale-100"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-muted hover:text-white transition-colors">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile hamburger -->
      <button @click="mobileMenuOpen = !mobileMenuOpen"
        class="md:hidden w-9 h-9 rounded-lg bg-brand-surface border border-brand-border flex flex-col items-center justify-center space-y-1.5 transition-all">
        <span :class="mobileMenuOpen ? 'rotate-45 translate-y-2' : ''"
          class="block w-4 h-0.5 bg-white transition-all duration-300"></span>
        <span :class="mobileMenuOpen ? 'opacity-0' : ''"
          class="block w-4 h-0.5 bg-white transition-all duration-300"></span>
        <span :class="mobileMenuOpen ? '-rotate-45 -translate-y-2' : ''"
          class="block w-4 h-0.5 bg-white transition-all duration-300"></span>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div x-show="mobileMenuOpen" x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="md:hidden bg-brand-dark/98 border-b border-brand-border px-4 pb-4 pt-2 space-y-3">
      <input type="text" x-model="searchQuery" placeholder="Search works…"
        class="w-full bg-brand-surface border border-brand-border text-sm text-white placeholder-brand-muted rounded-lg px-4 py-2 focus:outline-none focus:border-brand-accent">
      <div class="flex flex-wrap gap-2">
        <template x-for="cat in categories" :key="cat.id">
          <button @click="setCategory(cat.id); mobileMenuOpen=false"
            :class="activeCategory === cat.id ? 'bg-brand-accent text-white border-brand-accent' : 'text-gray-400 bg-brand-surface border-brand-border hover:border-brand-accent/50'"
            class="px-3 py-1 rounded-full text-xs font-medium border transition-all duration-200"
            x-text="cat.name"></button>
        </template>
      </div>
    </div>
  </header>


  <!-- ═══════════════════════════════════════════════════════
       HERO SECTION
  ═══════════════════════════════════════════════════════ -->
  <section class="relative pt-28 pb-16 lg:pt-40 lg:pb-24 hero-mesh overflow-hidden">

    <!-- Floating orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Grid lines overlay -->
    <div class="absolute inset-0 opacity-[0.04] pointer-events-none"
      style="background-image: linear-gradient(rgba(122,160,255,1) 1px, transparent 1px), linear-gradient(90deg, rgba(122,160,255,1) 1px, transparent 1px); background-size: 60px 60px;">
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <template x-if="featuredProject">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">

          <!-- Hero Text -->
          <div class="lg:col-span-7 space-y-6">
            <!-- Tag badge -->
            <div
              class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-full bg-brand-accent/10 border border-brand-accent/30 text-brand-accentLight text-xs font-semibold tracking-widest uppercase"
              x-transition:enter="transition ease-out duration-500 delay-100"
              x-transition:enter-start="opacity-0 -translate-x-4" x-transition:enter-end="opacity-100 translate-x-0">
              <span class="relative flex h-2 w-2">
                <span
                  class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-accent opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-accent"></span>
              </span>
              <span>Featured Showcase</span>
            </div>

            <h1 class="text-5xl sm:text-7xl font-royal font-light text-white tracking-wide leading-[1.05] hero-title-gradient"
              x-text="featuredProject.title"></h1>

            <!-- Tags row -->
            <div class="flex flex-wrap gap-2">
              <template x-for="g in featuredProject.genres" :key="g">
                <span
                  class="tag-blue px-3 py-1 bg-brand-accent/15 text-brand-accentLight border border-brand-accent/25 rounded-full text-xs font-semibold cursor-pointer"
                  x-text="g"></span>
              </template>
              <template x-for="t in featuredProject.techniques.slice(0,3)" :key="t">
                <span
                  class="tag-blue px-3 py-1 bg-brand-surface/80 text-gray-300 border border-brand-border rounded-full text-xs font-medium cursor-pointer"
                  x-text="t"></span>
              </template>
            </div>

            <p class="text-gray-300/90 text-base sm:text-lg leading-relaxed max-w-xl" x-text="featuredProject.synopsis">
            </p>

            <!-- Meta row -->
            <div class="flex items-center space-x-6 text-xs text-brand-muted font-mono">
              <span class="flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span x-text="featuredProject.client"></span>
              </span>
              <span class="flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span x-text="featuredProject.year"></span>
              </span>
              <span class="flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span x-text="featuredProject.duration"></span>
              </span>
            </div>

            <!-- CTAs -->
            <div class="flex flex-wrap items-center gap-4">
              <button @click="openModal(featuredProject)"

    /* ── Particle canvas ─────────────────────────────────── */
    (function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let W, H, particles = [];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const count = 70;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * 1920,
          y: Math.random() * 1080,
          r: Math.random() * 1.5 + 0.4,
          dx: (Math.random() - 0.5) * 0.3,
          dy: (Math.random() - 0.5) * 0.3,
          a: Math.random() * 0.6 + 0.1
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(122,160,255,${p.a})`;
          ctx.fill();

          p.x += p.dx;
          p.y += p.dy;
          if (p.x < 0) p.x = W;
          if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H;
          if (p.y > H) p.y = 0;
        });

        // Connect nearby particles
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(48,92,222,${0.15 * (1 - dist / 130)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
